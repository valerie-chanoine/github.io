<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Publications</title>
<link rel="stylesheet" href="assets/style.css">

<style>
.pub {
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
}
.title {
    font-weight: bold;
}
.meta {
    font-size: 0.9em;
    color: #555;
}
</style>

</head>

<body>

<header>
    <h1>Publications</h1>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="publications.html" class="active">Publications</a>
</nav>

<div class="container">
<div class="card">

<h2>ORCID publications</h2>

<div id="pubs">Loading...</div>

</div>
</div>

<script>
const ORCID_ID = "0000-0002-3492-8160"; 

async function loadPublications() {
  const orcidUrl = `https://pub.orcid.org/v3.0/${ORCID_ID}/works`;

  const res = await fetch(orcidUrl, {
    headers: { Accept: "application/json" }
  });

  const data = await res.json();

  const container = document.getElementById("pubs");
  container.innerHTML = "";

  let pubs = [];

  for (const work of data.group || []) {
    const title = work["work-summary"]?.[0]?.title?.title?.value;

    if (!title) continue;

    try {
      const paper = await fetchPaper(title);
      if (!paper) continue;

      pubs.push({
        year: paper.year || 0,
        text: formatAPA7(paper)
      });

    } catch (e) {
      console.log("skip:", title);
    }
  }

  pubs.sort((a, b) => b.year - a.year);

  container.innerHTML = pubs
    .map(p => `<div class="pub">${p.text}</div>`)
    .join("");
}
</script>


</body>
</html>
