<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Publications</title>
<link rel="stylesheet" href="assets/style.css">

<style>
.pub {
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
}
.title { font-weight: bold; }
.meta { font-size: 0.9em; color: #555; }
.source { font-size: 0.8em; color: #888; }
</style>

</head>

<body>

<header>
    <img src="photo.jpg" class="profile-photo">
    <h1>Valérie Chanoine, PhD</h1>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="publications.html" class="active">Publications</a>
    <a href="cv.html">CV</a>
</nav>

<div class="container">
<div class="card">

<h2>Publications (HAL + ORCID)</h2>

<div id="pubs">Loading...</div>

</div>
</div>

<script>

const ORCID_ID = "0000-0002-3492-8160";

// HAL endpoint (très stable)
const HAL_URL =
"https://api.archives-ouvertes.fr/search/?q=authIdHal_s:valerie-chanoine&wt=json&rows=100";

async function loadPublications() {

    const container = document.getElementById("pubs");
    container.innerHTML = "";

    /* ---------------- HAL ---------------- */
    try {
        const halRes = await fetch(HAL_URL);
        const halData = await halRes.json();

        const docs = halData.response.docs || [];

        docs.forEach(d => {
            const div = document.createElement("div");
            div.className = "pub";

            div.innerHTML = `
                <div class="title">${d.title_s?.[0] || "Untitled"}</div>
                <div class="meta">
                    ${d.publicationDateY_i || ""} • HAL
                </div>
                <div class="source">HAL</div>
            `;

            container.appendChild(div);
        });

    } catch (e) {
        console.log("HAL error", e);
    }

    /* ---------------- ORCID (optionnel fallback simple) ---------------- */
    try {
        const orcidRes = await fetch(
            `https://pub.orcid.org/v3.0/${ORCID_ID}/works`,
            { headers: { "Accept": "application/json" } }
        );

        const orcidData = await orcidRes.json();
        const works = orcidData.group || [];

        works.forEach(w => {
            const s = w["work-summary"]?.[0];
            const title = s?.title?.title?.value || "Untitled";
            const year = s?.["publication-date"]?.year?.value || "";

            const div = document.createElement("div");
            div.className = "pub";

            div.innerHTML = `
                <div class="title">${title}</div>
                <div class="meta">${year} • ORCID</div>
                <div class="source">ORCID</div>
            `;

            container.appendChild(div);
        });

    } catch (e) {
        console.log("ORCID error (normal parfois)", e);
    }

}

loadPublications();

</script>

</body>
</html>
