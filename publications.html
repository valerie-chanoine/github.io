<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Publications</title>
<link rel="stylesheet" href="assets/style.css">

<style>
.pub {
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
}
.title { font-weight: bold; }
.meta { font-size: 0.9em; color: #555; }
</style>

</head>

<body>

<header>
    <h1>Publications</h1>
</header>

<div class="container">
<div class="card">

<h2>HAL publications (test étape 1)</h2>

<div id="pubs">Loading...</div>

</div>
</div>

<script>

const HAL_URL =
"https://api.archives-ouvertes.fr/search/?q=authIdHal_s:valerie-chanoine&wt=json&rows=50";

async function load() {

    const container = document.getElementById("pubs");
    container.innerHTML = "";

    const res = await fetch(HAL_URL);
    const data = await res.json();

    const docs = data.response?.docs || [];

    if (docs.length === 0) {
        container.innerHTML = "Aucune publication HAL trouvée";
        return;
    }

    docs.forEach(d => {

        const div = document.createElement("div");
        div.className = "pub";

        div.innerHTML = `
            <div class="title">${d.title_s?.[0] || "Untitled"}</div>
            <div class="meta">
                ${d.publicationDateY_i || "n.d."} • HAL
            </div>
        `;

        container.appendChild(div);
    });
}

load();

</script>

</body>
</html>
