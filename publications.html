<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Publications</title>
<link rel="stylesheet" href="assets/style.css">

<style>
.pub {
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
}
.title {
    font-weight: bold;
}
.meta {
    font-size: 0.9em;
    color: #555;
}
</style>

</head>

<body>

<header>
    <h1>Publications</h1>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="publications.html" class="active">Publications</a>
</nav>

<div class="container">
<div class="card">

<h2>ORCID publications</h2>

<div id="pubs">Loading...</div>

</div>
</div>

<script>
const ORCID_ID "0000-0002-3492-8160"; 

async function loadPublications() {
  const url = `https://pub.orcid.org/v3.0/${ORCID_ID}/works`;

  try {
    const res = await fetch(url, {
      headers: {
        "Accept": "application/json"
      }
    });

    const data = await res.json();

    const container = document.getElementById("pubs");
    container.innerHTML = "";

    const works = data.group || [];

    works.forEach(w => {
      const title = w["work-summary"]?.[0]?.title?.title?.value || "Sans titre";

      const div = document.createElement("div");
      div.className = "pub";
      div.innerHTML = `<div class="title">${title}</div>`;

      container.appendChild(div);
    });

  } catch (err) {
    document.getElementById("pubs").innerHTML =
      "Erreur de chargement des publications";
    console.error(err);
  }
}

loadPublications();
</script>

</body>
</html>
