<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Publications</title>
<link rel="stylesheet" href="assets/style.css">

<style>
.pub {
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
}
.title {
    font-weight: bold;
}
.meta {
    font-size: 0.9em;
    color: #555;
}
</style>

</head>

<body>

<header>
    <h1>Publications</h1>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="publications.html" class="active">Publications</a>
</nav>

<div class="container">
<div class="card">

<h2>ORCID publications</h2>

<div id="pubs">Loading...</div>

</div>
</div>

<script>
const ORCID_ID = "0000-0002-3492-8160"; 

function formatAPA(work) {
  const summary = work["work-summary"]?.[0];

  const title = summary?.title?.title?.value || "Sans titre";

  // Auteurs (souvent incomplet dans ORCID)
  const authors = summary?.["contributor"]?.map(c => {
    const name = c?.["credit-name"]?.value;
    return name ? name : null;
  }).filter(Boolean);

  const authorStr = authors?.length
    ? authors.join(", ")
    : "Auteur inconnu";

  const year = summary?.["publication-date"]?.year?.value || "n.d.";

  const journal = summary?.["journal-title"]?.value || "";

  // APA simplifié
  return {
    year: parseInt(year) || 0,
    text: `${authorStr} (${year}). ${title}. ${journal}.`
  };
}

async function loadPublications() {
  const url = `https://pub.orcid.org/v3.0/${ORCID_ID}/works`;

  try {
    const res = await fetch(url, {
      headers: { "Accept": "application/json" }
    });

    const data = await res.json();

    let publications = (data.group || []).map(formatAPA);

    // tri par année décroissante
    publications.sort((a, b) => b.year - a.year);

    // regroupement HTML par année
    const container = document.getElementById("pubs");
    container.innerHTML = "";

    let currentYear = null;

    publications.forEach(pub => {
      const year = pub.year || "n.d.";

      if (year !== currentYear) {
        currentYear = year;

        const h = document.createElement("h3");
        h.textContent = year;
        container.appendChild(h);
      }

      const div = document.createElement("div");
      div.className = "pub";
      div.textContent = pub.text;

      container.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    document.getElementById("pubs").innerHTML =
      "Erreur de chargement des publications";
  }
}

loadPublications();
</script>


</body>
</html>
