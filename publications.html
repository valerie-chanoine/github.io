<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Publications</title>
<link rel="stylesheet" href="assets/style.css">

<style>
.pub {
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
}
.title {
    font-weight: bold;
}
.meta {
    font-size: 0.9em;
    color: #555;
}
</style>

</head>

<body>

<header>
    <h1>Publications</h1>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="publications.html" class="active">Publications</a>
    <a href="cv.html">CV</a>
</nav>

<div class="container">
<div class="card">

<h2>HAL publications</h2>

<div id="pubs">Loading...</div>

</div>
</div>

<script>

const HAL_URL =
"https://api.archives-ouvertes.fr/search/?q=authIdHal_s:valerie-chanoine&wt=json&rows=50";

async function loadPublications() {

    const container = document.getElementById("pubs");

    try {
        const res = await fetch(HAL_URL);
        const data = await res.json();

        const docs = data.response?.docs;

        console.log("HAL data:", data); // DEBUG important

        if (!docs || docs.length === 0) {
            container.innerHTML = "Aucune publication trouvée";
            return;
        }

        container.innerHTML = "";

        docs.forEach(doc => {

            const title = doc.title_s?.[0] || "Untitled";
            const year = doc.publicationDateY_i || doc.producedDateY_i || "";

            const div = document.createElement("div");
            div.className = "pub";

            div.innerHTML = `
                <div class="title">${title}</div>
                <div class="meta">${year} • HAL</div>
            `;

            container.appendChild(div);
        });

    } catch (err) {
        console.error(err);
        container.innerHTML = "Erreur chargement HAL (voir console)";
    }
}

loadPublications();

</script>

</body>
</html>
