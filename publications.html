<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Publications</title>
<link rel="stylesheet" href="assets/style.css">

<style>
.pub {
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
}
.title {
    font-weight: bold;
}
.meta {
    font-size: 0.9em;
    color: #555;
}
</style>

</head>

<body>

<header>
    <h1>Publications</h1>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="publications.html" class="active">Publications</a>
</nav>

<div class="container">
<div class="card">

<h2>ORCID publications</h2>

<div id="pubs">Loading...</div>

</div>
</div>

<script>
const ORCID_ID = "0000-0002-3492-8160"; 

async function loadPublicationsAPA() {
  const orcidUrl = `https://pub.orcid.org/v3.0/${ORCID_ID}/works`;

  const res = await fetch(orcidUrl, {
    headers: { Accept: "application/json" }
  });

  const data = await res.json();

  const container = document.getElementById("pubs");
  container.innerHTML = "";

  let pubs = [];

  for (const work of data.group || []) {
    const summary = work["work-summary"]?.[0];

    const doi = summary?.["external-ids"]?.["external-id"]
      ?.find(e => e["external-id-type"] === "doi")
      ?.["external-id-value"];

    if (!doi) continue;

    try {
      const meta = await fetchCrossref(doi);
      const apa = formatAPA7(meta);

      pubs.push({
        year: meta.published?.["date-parts"]?.[0]?.[0] || 0,
        text: apa
      });

    } catch (e) {
      console.log("DOI failed:", doi);
    }
  }

  pubs.sort((a, b) => b.year - a.year);

  let currentYear = null;

  pubs.forEach(p => {
    if (p.year !== currentYear) {
      currentYear = p.year;

      const h = document.createElement("h3");
      h.textContent = currentYear;
      container.appendChild(h);
    }

    const div = document.createElement("div");
    div.className = "pub";
    div.textContent = p.text;

    container.appendChild(div);
  });
}

loadPublicationsAPA();
</script>


</body>
</html>
