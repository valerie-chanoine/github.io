<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Publications</title>
<link rel="stylesheet" href="assets/style.css">

<style>
.pub {
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
}
.title { font-weight: bold; }
.meta { font-size: 0.9em; color: #555; }
.source {
    font-size: 0.8em;
    color: #888;
}
</style>

</head>

<body>

<header>
    <img src="photo.jpg" class="profile-photo">
    <h1>Valérie Chanoine, PhD</h1>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="publications.html" class="active">Publications</a>
</nav>

<div class="container">
<div class="card">

<h2>Publications</h2>

<div id="pubs">Loading publications...</div>

</div>
</div>

<script>
async function load() {

    const res = await fetch("publications.json");
    const data = await res.json();

    const container = document.getElementById("pubs");
    container.innerHTML = "";

    const orcidWorks = data.orcid.group || [];

    orcidWorks.forEach(w => {

        const s = w["work-summary"]?.[0];
        const title = s?.title?.title?.value || "Untitled";
        const year = s?.["publication-date"]?.year?.value || "";
        const type = s?.type || "";

        let div = document.createElement("div");
        div.className = "pub";

        div.innerHTML = `
            <div class="title">${title}</div>
            <div class="meta">${year} • ${type}</div>
            <div class="source">ORCID</div>
        `;

        container.appendChild(div);
    });

    const halDocs = data.hal?.response?.docs || [];

    halDocs.forEach(d => {

        let div = document.createElement("div");
        div.className = "pub";

        div.innerHTML = `
            <div class="title">${d.title_s?.[0] || "Untitled"}</div>
            <div class="meta">${d.docType_s || ""} • HAL</div>
            <div class="source">HAL</div>
        `;

        container.appendChild(div);
    });
}

load();
</script>

</body>
</html>
